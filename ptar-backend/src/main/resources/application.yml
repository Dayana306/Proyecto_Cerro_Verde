spring:
  application:
    name: ptar-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      #el esquema lo gestiona Flyway; Hibernate solo verifica que las entidades coincidan
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
    # en producción usar un usuario con permisos ddl distinto del usuario de la aplicacion
    user: ${FLYWAY_USER:${DB_USER}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
  jackson:
    time-zone: America/Lima
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Obligatorio mínimo 32 caracteres sin valor por defecto a propósito
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
